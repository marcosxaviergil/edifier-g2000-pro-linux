; Edifier Hecate G2000 PRO (USB 35bb:b065, Jieli Technology)
;
; Only the analog stereo output is offered. Its mixer path (analog-output)
; drives the device's own "PCM" control, so the system volume and mute move
; the speaker's hardware volume (PCM Playback Volume) and hardware switch
; (PCM Playback Switch). The default profile set also offers iec958-stereo,
; whose path has no volume element: with it, every volume change is software
; only. A stored iec958 profile is ignored once it no longer exists here.
;
; The driver reports PCM from -28.37 dB to -0.94 dB. ACP treats a negative
; maximum as wrong decibel data and disables it, so the volume is applied
; to the hardware steps only, with no software volume on top.
;
; Format: profile-sets/default.conf of PipeWire (alsa-card-profile).
; Verified on Debian 13 with PipeWire 1.4.2 and WirePlumber 0.5.8.

[General]
auto-profiles = yes

[Mapping analog-stereo]
device-strings = front:%f
channel-map = left,right
paths-output = analog-output
direction = output
priority = 15
