## Edifier Hecate G2000 PRO: system volume drives the speaker's hardware volume.
##
## Applies only to the USB device 35bb:b065. Other audio devices are not
## touched. The profile set named here offers the analog output, whose mixer
## path uses the device's PCM control (see edifier-hecate-g2000-pro.conf).
##
## Requires WirePlumber 0.5 or newer (SPA-JSON configuration fragments).

monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x35bb"
        device.product.id = "0xb065"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "edifier-hecate-g2000-pro.conf"
      }
    }
  }
]
